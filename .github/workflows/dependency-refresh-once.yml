name: BRIX One-Time Dependency Refresh

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.head_commit.message == 'run hardened dependency major refresh'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VITE_SUPABASE_URL: https://example.invalid
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-publishable-key
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Replace vulnerable dependency paths
        run: |
          npm install fflate@^0.8.3 react-router-dom@^7.18.2 --save
          npm install vite@^8.2.1 @vitejs/plugin-react-swc@^4.3.2 --save-dev
          node scripts/harden-xlsx-intake.mjs
          npm audit fix --package-lock-only || true
      - name: Verify hardened repository before commit
        run: npm run verify:ci
      - name: Commit verified dependency hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src/core/packageBatchIntake.ts src/test/packageBatchIntake.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "harden XLSX intake and production dependencies"
          git push origin HEAD:main
